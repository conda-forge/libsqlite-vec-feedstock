schema_version: 1

context:
  version: "0.1.9"

recipe:
  name: sqlite-vec
  version: ${{ version }}

source:
  url: https://github.com/asg017/sqlite-vec/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 9823e737d9934dcbe85dff75d3fca81018a9beee803d70fa77b16faab5d61dc9
  patches:
    - 0001-respect-build-flags.patch
    - 0002-avoid-using-uv-in-tests.patch

build:
  number: 1

outputs:
  - package:
      name: libsqlite-vec
    build:
      script:
        - if: unix
          then: build.sh
          else: build.bat
    requirements:
      build:
        - ${{ stdlib("c") }}
        - ${{ compiler('c') }}
        - gettext  # envsubst for sqlite-vec.h generation
        - if: unix
          then: make
        - if: win
          then:
            - m2-bash
            - m2-coreutils
            - m2-sed
            - m2-make
      host:
        - libsqlite
      run:
        - libsqlite
      # sqlite-vec use sqlite's table interface API, not a linked libsqlite.
      ignore_run_exports:
        by_name:
          - libsqlite
    tests:
      - script: bash test_libsqlite-vec.sh
        files:
          source:
            - tests/
            - Makefile
          recipe:
            - test_libsqlite-vec.sh
        requirements:
          run:
            - python >=${{ python_min }}
            - pytest
            - numpy
            - syrupy
            - if: unix
              then: make
            - if: win
              then:
                - m2-bash
                - m2-coreutils
                - m2-sed
                - m2-make
  - package:
      name: sqlite-vec-python
    build:
      noarch: python
      script:
        content:
          - python -m pip install "${{ RECIPE_DIR }}/sqlite-vec-python" -vv --no-build-isolation --no-deps
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools
        - pip
      run:
        - python >=${{ python_min }}
        - libsqlite-vec ==${{ version }}
        - numpy
    tests:
      - python:
          imports:
            - sqlite_vec
          python_version:
            - ${{ python_min }}.*
            - "*"
      - script:
          - >-
              python -c "import sqlite3, sqlite_vec;
              db = sqlite3.connect(':memory:');
              db.enable_load_extension(True);
              sqlite_vec.load(db);"
          - >-
              python -c "import sqlite_vec, importlib.metadata;
              assert '${{ version }}' == importlib.metadata.version('sqlite-vec'), 'Version mismatch, please update recipe/sqlite-vec/pyproject.toml';
              assert '${{ version }}' == sqlite_vec.__version__, 'Version mismatch, please update recipe/sqlite-vec/sqlite_vec/__init__.py';"

about:
  homepage: https://github.com/asg017/sqlite-vec
  summary: SQLite loadable extension for vector search
  description: |
    sqlite-vec is a SQLite loadable extension providing vector search
    functionality through the vec0 virtual table and vec_* SQL functions.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
  repository: https://github.com/asg017/sqlite-vec
  documentation: https://alexgarcia.xyz/sqlite-vec/

extra:
  feedstock-name: libsqlite-vec
  recipe-maintainers:
    - jsmolic
